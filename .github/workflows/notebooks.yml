name: Test notebooks

on:
  push:
    branches: [main]
    paths:
      - "**/*.ipynb"
      - "common/**/*.py"
      - "environment.yml"
      - ".github/workflows/notebooks.yml"
  pull_request:
    paths:
      - "**/*.ipynb"
      - "common/**/*.py"
      - "environment.yml"
      - ".github/workflows/notebooks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebooks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
    env:
      MPLBACKEND: Agg
      PYTHONPATH: ${{ github.workspace }}/common
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create course environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: reinforcement-learning
          environment-file: environment.yml
          miniforge-version: latest
          conda-remove-defaults: "true"

      - name: Validate all notebook files
        run: |
          python - <<'PY'
          import os
          import subprocess

          import nbformat

          paths = subprocess.check_output(
              ["git", "ls-files", "*.ipynb"], text=True
          ).splitlines()
          failures = []
          for path in paths:
              try:
                  with open(path, encoding="utf-8") as notebook_file:
                      nbformat.validate(nbformat.read(notebook_file, as_version=4))
                  print(f"Validated {path}")
              except Exception as error:
                  message = " ".join(str(error).split())
                  if len(message) > 300:
                      message = f"{message[:297]}..."
                  failures.append((path, f"{type(error).__name__}: {message}"))
                  print(f"::error file={path}::Notebook validation failed: {message}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              if failures:
                  summary.write("## Failed notebook validation tests\n\n")
                  summary.write("| Notebook | Failure |\n| --- | --- |\n")
                  for path, message in failures:
                      message = message.replace("|", "\\|")
                      summary.write(f"| `{path}` | {message} |\n")
                  summary.write("\n")
              else:
                  summary.write(
                      f"## Notebook validation\n\nAll {len(paths)} notebooks are valid.\n\n"
                  )

          if failures:
              raise SystemExit(f"{len(failures)} notebook validation test(s) failed")
          PY

      # Assignments contain intentionally incomplete cells. DRL notebooks need
      # long training runs or trained-model archives, so both groups are still
      # validated above but are not executed in CI.
      - name: Execute teaching notebooks
        run: |
          mapfile -t notebooks < <(
            git ls-files '*.ipynb' |
              grep -Ev '(^DRL/|(^|/)assignment-)'
          )

          failures=()
          for notebook in "${notebooks[@]}"; do
            output_dir="/tmp/executed-notebooks/$(dirname "$notebook")"
            mkdir -p "$output_dir"
            echo "Executing $notebook"
            log_file="/tmp/executed-notebooks/nbconvert.log"
            if jupyter nbconvert \
                --to notebook \
                --execute "$notebook" \
                --output-dir "$output_dir" \
                --ExecutePreprocessor.timeout=900 >"$log_file" 2>&1; then
              cat "$log_file"
            else
              failures+=("$notebook")
              echo "::error file=$notebook::Notebook execution failed"
              echo "::group::Failure output for $notebook"
              cat "$log_file"
              echo "::endgroup::"
            fi
          done

          if ((${#failures[@]})); then
            {
              echo "## Failed notebook execution tests"
              echo
              echo "| Notebook | Failure |"
              echo "| --- | --- |"
              for notebook in "${failures[@]}"; do
                printf '| `%s` | Execution failed; see the step log. |\n' "$notebook"
              done
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "## Notebook execution"
            echo
            echo "All ${#notebooks[@]} selected notebooks executed successfully."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
